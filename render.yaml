# One-click deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: web
    name: incidentroom
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: incidentroom-db
          property: connectionString
      - key: GITHUB_WEBHOOK_SECRET
        generateValue: true
      - key: SENTRY_WEBHOOK_SECRET
        sync: false
      - key: INGEST_TOKEN
        generateValue: true
      - key: AI_API_KEY
        sync: false

databases:
  - name: incidentroom-db
    plan: free
    databaseName: incidentroom
